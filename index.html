<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IncRPG</title>

    <link rel="shortcut icon" type="image/png" href="resources/rat.png" />
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="game-container">
      <main id="game-screen">
        <div id="hero-panel"></div>


      <div class="centre-panel">
        <div class="top-panels">
          <div id="actions-panel"></div>
          <div id="activity-panel"></div>
        </div>
        <div class="bottom-panels">
          <div id="actor-panel"></div>
          <div id="skills-panel"></div>
        </div>
      </div>


      <div id="log-box"></div>
      </main>

      <footer>
        <p>SardineMilk</p>
        <a href="https://github.com/SardineMilk/incrpg" target="_blank">
          <img src="resources/github-logo.svg" alt="GitHub" class="logo" />
        </a>
        <a href="https://buymeacoffee.com/sardinemilk" target="_blank">
          <img
            src="resources/bmc-logo.svg"
            alt="Buy Me A Coffee"
            class="logo"
          />
        </a>
      </footer>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
