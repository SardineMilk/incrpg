<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IncRPG</title>

    <link rel="shortcut icon" type="image/png" href="resources/rat.png" />
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <div class="game-container">
      <header>
        <p>Incredible Rat Punching Game</p>
      </header>

      <main class="game-screen">
        <div class="hero-box">
          <div class="name-box">Hero</div>
          <div class="status-box">
            <div class="health-bar" id="health-bar">HP</div>
            <div class="stamina-bar" id="stamina-bar">SP</div>
            <div class="mental-bar" id="mental-bar">MP</div>
          </div>
          <div class="stats-box" id="stats-box"></div>
          <div class="location-box" id="location-box"></div>
        </div>


      <div class="centre-panel">
        <div class="top-panels">
          <div id="actions-box"></div>
          <div id="activity-box"></div>
        </div>

        <div id="skills-box"></div>
      </div>

        <div id="log-box"></div>
      </main>

      <footer>
        <p>SardineMilk</p>
        <a href="https://github.com/SardineMilk/incrpg" target="_blank">
          <img src="resources/github-logo.svg" alt="GitHub" class="logo" />
        </a>
        <a href="https://buymeacoffee.com/sardinemilk" target="_blank">
          <img
            src="resources/bmc-logo.svg"
            alt="Buy Me A Coffee"
            class="logo"
          />
        </a>
      </footer>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
